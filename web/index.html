<div class="demo-bar" id="demoBar" hidden>Demo modu: veriler yerel dosyadan okunuyor, değişiklikler kaydedilmez.</div>

<div class="shell">
  <aside class="sidebar" id="side" aria-label="Menü">
    <div class="side-top">
      <div class="brand"><img class="brand-logo" src="brand/logo.png" alt="English with Kawthar" width="818" height="572"></div>
      <button class="icon-btn side-close" data-act="menu" aria-label="Menüyü kapat"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="side-app">
      <button class="btn side-cta" data-act="quick"><svg class="ico"><use href="#i-plus"/></svg>Yeni ekle</button>
      <nav class="side-nav" aria-label="Sayfalar">
        <button data-tab="ozet"><svg class="ico"><use href="#i-home"/></svg><span class="nav-l">Bugün</span></button>
        <button data-tab="ogrenciler"><svg class="ico"><use href="#i-users"/></svg><span class="nav-l">Öğrenciler</span></button>
        <button data-tab="program"><svg class="ico"><use href="#i-cal"/></svg><span class="nav-l">Ders Programı</span></button>
        <button data-tab="odemeler"><svg class="ico"><use href="#i-wallet"/></svg><span class="nav-l">Ödemeler</span></button>
        <button data-tab="notlar"><svg class="ico"><use href="#i-note"/></svg><span class="nav-l">Notlar</span></button>
        <button data-tab="defterler"><svg class="ico"><use href="#i-book"/></svg><span class="nav-l">Defterler</span></button>
        <button data-tab="hocalar"><svg class="ico"><use href="#i-teach"/></svg><span class="nav-l">Hocalar</span></button>
        <button data-tab="ayarlar"><svg class="ico"><use href="#i-gear"/></svg><span class="nav-l">Ayarlar</span></button>
      </nav>
    </div>
    <div class="side-foot todayLbl"></div>
  </aside>

  <div class="main-col">
    <header class="mtop">
      <div class="brand"><img class="brand-mono" src="brand/monogram.png" alt="English with Kawthar" width="668" height="363"></div>
      <span class="mtop-r"><span class="mtop-date todayLbl"></span>
        <button class="icon-btn" data-act="menu" aria-label="Diğer sayfalar: Notlar, Hocalar, Ayarlar"><svg class="ico"><use href="#i-menu"/></svg></button></span>
    </header>
    <main class="content" id="app"><div class="panel empty">Veriler yükleniyor. Öğrenciler, ödemeler ve ders programı birkaç saniye içinde burada görünecek.</div></main>
  </div>
</div>

<nav class="bnav" aria-label="Sayfalar">
  <button data-tab="ozet"><svg class="ico"><use href="#i-home"/></svg>Bugün</button>
  <button data-tab="ogrenciler"><svg class="ico"><use href="#i-users"/></svg>Öğrenciler</button>
  <button class="bnav-plus" data-act="quick" aria-label="Yeni ekle: ödeme, not, telafi, öğrenci"><svg class="ico"><use href="#i-plus"/></svg></button>
  <button data-tab="program"><svg class="ico"><use href="#i-cal"/></svg>Program</button>
  <button data-tab="odemeler"><svg class="ico"><use href="#i-wallet"/></svg>Ödemeler</button>
</nav>
<div class="menu-scrim" data-act="menu"></div>
